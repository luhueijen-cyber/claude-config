name: Daily Brief

on:
  schedule:
    # 06:00 Asia/Taipei = 22:00 UTC（前一個 UTC 日）
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 tzdata yfinance icalendar recurring-ical-events

      - name: Send daily brief
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_SENDER: luhueijen@shsh.ylc.edu.tw
          # Google Calendar 私密 iCal 網址（在 Google Calendar 設定頁取得）
          CALENDAR_ICAL_URL: ${{ secrets.CALENDAR_ICAL_URL }}
          # 個人 Gmail App Password（選用，設定後可讀取 luhueijen@gmail.com 信箱）
          GMAIL_PERSONAL_APP_PASSWORD: ${{ secrets.GMAIL_PERSONAL_APP_PASSWORD }}
        run: python scripts/send_brief.py
