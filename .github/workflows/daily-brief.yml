name: Daily Brief

on:
  schedule:
    # 06:00 Asia/Taipei = 22:00 UTC（前一個 UTC 日）
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 tzdata yfinance

      - name: Send daily brief
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_SENDER: luhueijen@shsh.ylc.edu.tw
          # 選用：設定後可自動讀取 Google 行事曆
          # GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          # CALENDAR_ID: luhueijen@gmail.com
        run: python scripts/send_brief.py
