name: Daily Brief

on:
  schedule:
    # 06:30 Asia/Taipei = 22:30 UTC
    - cron: "30 22 * * *"
  workflow_dispatch: {}

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tzdata
        run: pip install tzdata

      - name: Copy todo.md to home directory
        run: cp todo.md ~/todo.md

      - name: Send daily brief
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_SENDER: luhueijen@shsh.ylc.edu.tw
        run: python scripts/send_brief.py
